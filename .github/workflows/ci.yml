name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type checking
        run: npx tsc --noEmit

      - name: Run Unit and Transpiler Tests
        run: npx tsx --test lib/__tests__/semantic-transpiler.test.ts lib/__tests__/cube-transpiler.test.ts lib/__tests__/dbt-parser.test.ts lib/__tests__/semantic-compiler.test.ts lib/__tests__/chat-route.test.ts
