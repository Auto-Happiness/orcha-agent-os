[package]
name = "orcha-semantic-engine"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
license = "MIT"
description = "A lightweight SQL semantic translation layer on Apache DataFusion for WebAssembly"

[lib]
# "cdylib" is required to compile to a WebAssembly binary (.wasm)
# "rlib" is required for local unit testing
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# 1. Apache DataFusion (Without heavy execution features to keep the binary small)
datafusion = { version = "53", default-features = false, features = [
    "sql",                  # Allows parsing SQL queries
    "unicode_expressions",  # Basic string operations support
] }

# 2. WASM Bindings (to interface between JS/TS and Rust)
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen-futures = "0.4"

# 3. Time: chrono with wasmbind support
chrono = { version = "0.4", features = ["wasmbind"] }
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }